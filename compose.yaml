services:
  backend:
    image: phinance-backend:dev
    build:
      context: ./backend
      network: host
    environment:
      SQLITE_PATH: /data/db.sqlite3
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,.app.github.dev}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,https://*.app.github.dev}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      - ./backend:/app
      - sqlite_data:/data
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
      python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/auth/csrf/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
  gold-price-updater:
    image: phinance-backend:dev
    command: ["python", "manage.py", "update_gold_price", "--loop"]
    environment:
      SQLITE_PATH: /data/db.sqlite3
      NAVASAN_API_KEY: ${NAVASAN_API_KEY:-}
    volumes:
      - ./backend:/app
      - sqlite_data:/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      network: host
    environment:
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - ./:/workspace
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  sqlite_data:
  frontend_node_modules:
